version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - agent-os

  runtime:
    build:
      context: .
      dockerfile: deploy/runtime/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - agent-os

  agents:
    build:
      context: .
      dockerfile: deploy/agents/Dockerfile
    env_file:
      - .env
    depends_on:
      - redis
    networks:
      - agent-os

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agent-os

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    environment:
      POSTGRES_DB: agent_os
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - agent-os

networks:
  agent-os:
    driver: bridge

volumes:
  redis-data:
  postgres-data: