[project]
name = "agent-os"
version = "0.1.0"
description = "Event-driven agent orchestration framework"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Pramit" }]
dependencies = [
    "msgspec>=0.21.1",
    "pydantic-settings>=2.14.1",
    "redis[hiredis]>=7.4.0",
    "structlog>=25.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "mypy>=1.8.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.uv.workspace]
members = ["src/app", "src/runtime", "src/agents"]

[tool.uv.sources]
agent-os-runtime = { workspace = true }
agent-os-agents = { workspace = true }

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
